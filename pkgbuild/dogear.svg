<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Dogear</title>
  <desc>A closed book in deep blue with a cream page lying on it, lines of text on the page, its top-right corner folded down as a yellow dog-ear, each piece with a hard shadow.</desc>
  <g transform="translate(11 -14)">
  <!-- The book underneath: its cover and the edges of its pages. -->
  <rect x="86" y="88" width="300" height="384" rx="26" fill="#14151c" transform="translate(0 12)"/>
  <rect x="86" y="88" width="300" height="384" rx="26" fill="#2c3e63" stroke="#22304d" stroke-width="3"/>
  <rect x="86" y="88" width="26" height="384" rx="13" fill="#22304d"/>
  <!-- The page, cut where the corner is folded; one hard shadow, as Omacut's film. -->
  <path d="M146 64 H316 L404 152 V420 Q404 448 376 448 H146 Q118 448 118 420 V92 Q118 64 146 64 Z"
        fill="#14151c" opacity=".55" transform="translate(-6 10)"/>
  <path d="M146 64 H316 L404 152 V420 Q404 448 376 448 H146 Q118 448 118 420 V92 Q118 64 146 64 Z"
        fill="#f6f1e4" stroke="#d8ceb6" stroke-width="3"/>
  <!-- Lines of text, kept clear of the fold. -->
  <g fill="#b3a98f">
    <rect x="160" y="112" width="112" height="16" rx="8" fill="#8f8570"/>
    <rect x="160" y="196" width="202" height="14" rx="7"/>
    <rect x="160" y="230" width="202" height="14" rx="7"/>
    <rect x="160" y="264" width="202" height="14" rx="7"/>
    <rect x="160" y="298" width="202" height="14" rx="7"/>
    <rect x="160" y="332" width="202" height="14" rx="7"/>
    <rect x="160" y="366" width="124" height="14" rx="7"/>
  </g>
  <!-- The dog-ear: the corner folded down onto the page, casting a shadow. -->
  <path d="M316 64 L404 152 L334 166 Z" fill="#14151c" opacity=".28"/>
  <path d="M316 64 L404 152 H338 Q316 152 316 130 Z" fill="#FFD60A" stroke="#d9b300" stroke-width="3" stroke-linejoin="round"/>
  <path d="M322 78 L390 146" stroke="#fff3a6" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
