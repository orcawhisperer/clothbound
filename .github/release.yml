changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Packaging & CI
      labels:
        - packaging
        - ci
    - title: Documentation & Translations
      labels:
        - documentation
        - translations
    - title: Other Changes
      labels:
        - "*"
