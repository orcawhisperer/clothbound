name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch-package:
    name: Build Arch Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build & runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            cmake \
            ninja \
            qt6-base \
            qt6-declarative \
            qt6-wayland \
            qt6-webengine \
            qt6-webchannel \
            qt6-svg \
            qt6-multimedia \
            libsecret \
            dbus \
            xdg-desktop-portal \
            zlib \
            tar \
            bzip2 \
            nodejs \
            python \
            desktop-file-utils \
            xorg-server-xvfb

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and run tests before packaging
        run: |
          ./bin/build
          ./bin/test
          ./bin/translate check
          desktop-file-validate pkgbuild/clothbound.desktop
          rm -rf build

      - name: Build Arch package with makepkg
        run: |
          useradd -m builder
          rm -rf /tmp/pkg-src /tmp/pkg-out /tmp/pkg-build /tmp/pkg-check
          mkdir -p /tmp/pkg-out /tmp/pkg-build /tmp/pkg-check
          cp -a "$GITHUB_WORKSPACE" /tmp/pkg-src
          chown -R builder:builder /tmp/pkg-src /tmp/pkg-out /tmp/pkg-build
          su builder -c "cd /tmp/pkg-src/pkgbuild && BUILDDIR=/tmp/pkg-build PKGDEST=/tmp/pkg-out PKGEXT='.pkg.tar.zst' makepkg -f --skipchecksums"
          ls -lh /tmp/pkg-out/
          pkg=$(find /tmp/pkg-out -maxdepth 1 -name 'clothbound-[0-9]*.pkg.tar.zst' | head -n 1)
          test -n "$pkg"
          bsdtar -xf "$pkg" -C /tmp/pkg-check
          for bin in /tmp/pkg-check/usr/bin/clothbound /tmp/pkg-check/usr/bin/clothbound-mcp; do
            count=$(readelf -Ws "$bin" | grep -c '@Qt_6_PRIVATE_API' || true)
            echo "$bin PRIVATE_API symbol count: $count"
            test "$count" -eq 0
            readelf -d "$bin" | grep -q 'BIND_NOW'
          done
          bad_deps=$(ldd /tmp/pkg-check/usr/bin/clothbound-mcp | grep -iE 'webengine|quick|qml|multimedia' || true)
          test -z "$bad_deps"
          i18n_count=$(find /tmp/pkg-check/usr/share/clothbound/i18n -maxdepth 1 -name '*.json' | wc -l)
          echo "Packaged i18n catalogs: $i18n_count"
          test "$i18n_count" -eq 50
          (cd /tmp/pkg-out && sha256sum "$(basename "$pkg")" > SHA256SUMS)
          cat /tmp/pkg-out/SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 -c '
          import os, re
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else ""
          if body:
              body += f"\n\n---\n\n### Install on Arch Linux / Omarchy\n```sh\ncurl -LO https://github.com/orcawhisperer/clothbound/releases/download/v{ver}/clothbound-{ver}-1-x86_64.pkg.tar.zst\nsudo pacman -U ./clothbound-{ver}-1-x86_64.pkg.tar.zst\n```\n\nDownload first: `pacman -U <url>` requires a package signature, and this package is unsigned. The prebuilt package is x86_64 only; on aarch64 (Asahi), build from source with `./bin/install`.\n"
          open("/tmp/release-notes.md", "w", encoding="utf-8").write(body)
          print("Release notes bytes:", len(body))
          '

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v7
        with:
          name: clothbound-arch-package
          path: |
            /tmp/pkg-out/clothbound-[0-9]*.pkg.tar.zst
            /tmp/pkg-out/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: true
          files: |
            /tmp/pkg-out/clothbound-[0-9]*.pkg.tar.zst
            /tmp/pkg-out/SHA256SUMS
