name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch-package:
    name: Build Arch Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build & runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            cmake \
            ninja \
            qt6-base \
            qt6-declarative \
            qt6-wayland \
            qt6-webengine \
            qt6-webchannel \
            qt6-svg \
            qt6-multimedia \
            libsecret \
            dbus \
            xdg-desktop-portal \
            zlib \
            tar \
            bzip2 \
            nodejs \
            python \
            desktop-file-utils \
            xorg-server-xvfb

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and run tests before packaging
        run: |
          ./bin/build
          ./bin/test
          ./bin/translate check --strict
          desktop-file-validate pkgbuild/clothbound.desktop
          rm -rf build

      - name: Build Arch package with makepkg
        run: |
          useradd -m builder
          rm -rf /tmp/pkg-src /tmp/pkg-out /tmp/pkg-build /tmp/pkg-check
          mkdir -p /tmp/pkg-out /tmp/pkg-build /tmp/pkg-check
          cp -a "$GITHUB_WORKSPACE" /tmp/pkg-src
          chown -R builder:builder /tmp/pkg-src /tmp/pkg-out /tmp/pkg-build
          su builder -c "cd /tmp/pkg-src/pkgbuild && BUILDDIR=/tmp/pkg-build PKGDEST=/tmp/pkg-out PKGEXT='.pkg.tar.zst' makepkg -f --skipchecksums"
          ls -lh /tmp/pkg-out/
          pkg=$(find /tmp/pkg-out -maxdepth 1 -name 'clothbound-[0-9]*.pkg.tar.zst' | head -n 1)
          test -n "$pkg"
          bsdtar -xf "$pkg" -C /tmp/pkg-check
          for bin in /tmp/pkg-check/usr/bin/clothbound /tmp/pkg-check/usr/bin/clothbound-mcp; do
            count=$(readelf -Ws "$bin" | grep -c '@Qt_6_PRIVATE_API' || true)
            echo "$bin PRIVATE_API symbol count: $count"
            test "$count" -eq 0
            readelf -d "$bin" | grep -q 'BIND_NOW'
          done
          bad_deps=$(ldd /tmp/pkg-check/usr/bin/clothbound-mcp | grep -iE 'webengine|quick|qml|multimedia' || true)
          test -z "$bad_deps"
          i18n_count=$(find /tmp/pkg-check/usr/share/clothbound/i18n -maxdepth 1 -name '*.json' | wc -l)
          echo "Packaged i18n catalogs: $i18n_count"
          test "$i18n_count" -eq 50

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v7
        with:
          name: clothbound-arch-package
          path: /tmp/pkg-out/clothbound-[0-9]*.pkg.tar.zst

  flatpak-bundle:
    name: Build Flatpak Bundle (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate AppStream metainfo
        run: appstreamcli validate --pedantic --no-net flatpak/app.clothbound.Reader.metainfo.xml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: clothbound.flatpak
          manifest-path: flatpak/app.clothbound.Reader.yml
          cache: true
          upload-artifact: false

      - name: Name versioned Flatpak bundle
        run: |
          ver=$(sed -n 's/^project(clothbound VERSION \([0-9][^ ]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          fi
          mv clothbound.flatpak "clothbound-${ver}-x86_64.flatpak"
          ls -lh "clothbound-${ver}-x86_64.flatpak"

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: clothbound-flatpak-bundle
          path: clothbound-*-x86_64.flatpak

  publish-release:
    name: Publish GitHub Release
    needs: [arch-package, flatpak-bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/release-files
          merge-multiple: true

      - name: Compute unified SHA256SUMS and extract release notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls -lh /tmp/release-files
          (
            cd /tmp/release-files
            sha256sum clothbound-*.pkg.tar.zst clothbound-*-x86_64.flatpak > SHA256SUMS
            src_tar="clothbound-${ver}.tar.gz"
            curl -fsSL -o "${src_tar}" "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
            sha256sum "${src_tar}" >> SHA256SUMS
            rm -f "${src_tar}"
            cat SHA256SUMS
          )
          python3 -c '
          import os, re
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else ""
          if body:
              body += f"\n\n---\n\n### Install on Linux\nOne-line installer (Arch / Omarchy native package, or verified Flatpak bundle on Ubuntu, Fedora, Debian, Mint, SteamOS):\n```sh\ncurl -fsSL https://clothbound.app/install | bash\n```\n\nOr install directly:\n- **Flatpak (any Linux distro, x86_64):**\n  ```sh\n  curl -LO https://github.com/orcawhisperer/clothbound/releases/download/v{ver}/clothbound-{ver}-x86_64.flatpak\n  flatpak install --user ./clothbound-{ver}-x86_64.flatpak\n  ```\n- **Arch Linux / Omarchy (x86_64):**\n  ```sh\n  curl -LO https://github.com/orcawhisperer/clothbound/releases/download/v{ver}/clothbound-{ver}-1-x86_64.pkg.tar.zst\n  sudo pacman -U ./clothbound-{ver}-1-x86_64.pkg.tar.zst\n  ```\n"
          open("/tmp/release-notes.md", "w", encoding="utf-8").write(body)
          print("Release notes bytes:", len(body))
          '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: true
          files: |
            /tmp/release-files/clothbound-*.pkg.tar.zst
            /tmp/release-files/clothbound-*-x86_64.flatpak
            /tmp/release-files/SHA256SUMS
