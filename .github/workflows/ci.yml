name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "pkgbuild/**"
      - "flatpak/**"
      - "bin/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "pkgbuild/**"
      - "flatpak/**"
      - "bin/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-release:
    name: Arch Linux Release, Tests & Lint
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            cmake \
            ninja \
            ccache \
            qt6-base \
            qt6-declarative \
            qt6-wayland \
            qt6-webengine \
            qt6-webchannel \
            qt6-svg \
            qt6-multimedia \
            qt6-tools \
            libsecret \
            dbus \
            zlib \
            tar \
            bzip2 \
            nodejs \
            python \
            desktop-file-utils \
            xorg-server-xvfb

      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore ccache (release)
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-arch-release-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'src/**/*.h', 'src/**/*.cpp', 'tests/**/*.h', 'tests/**/*.cpp') }}
          restore-keys: |
            ccache-arch-release-${{ runner.arch }}-

      - name: Build Clothbound & clothbound-mcp (CMake, qmlcachegen AOT, hardened)
        run: |
          ccache --zero-stats
          ./bin/build

      - name: Verify ELF hardening, zero private Qt6 ABI symbols, and WebEngine-free MCP
        run: |
          for bin in build/clothbound build/clothbound-mcp; do
            count=$(readelf -Ws "$bin" | grep -c '@Qt_6_PRIVATE_API' || true)
            echo "$bin PRIVATE_API symbol count: $count"
            test "$count" -eq 0
            readelf -d "$bin" | grep -q 'BIND_NOW'
          done
          bad_deps=$(ldd build/clothbound-mcp | grep -iE 'webengine|quick|qml|multimedia' || true)
          test -z "$bad_deps"

      - name: Run unit, QML smoke, concurrency, WebEngine E2E, and Wave-8 tests
        run: |
          ./bin/test
          ccache --show-stats

      - name: Validate translations, JS, QML lint, and desktop entry
        run: |
          ./bin/translate check --strict
          node --check src/reader/reader.js src/reader/hyphenation.js src/reader/dropcap.js
          /usr/lib/qt6/bin/qmllint --unqualified disable -I src/ui -I src/ui/style $(find src/ui -name '*.qml' | sort)
          desktop-file-validate pkgbuild/clothbound.desktop

      - name: Smoke-test local stdio MCP server and headless CLI (clothbound-mcp and clothbound)
        run: |
          TMP_XDG=$(mktemp -d)
          trap 'rm -rf "$TMP_XDG"' EXIT
          export XDG_DATA_HOME="$TMP_XDG/data" XDG_CONFIG_HOME="$TMP_XDG/config" XDG_CACHE_HOME="$TMP_XDG/cache"
          ./build/clothbound list >/dev/null
          ./build/clothbound-mcp list --json >/dev/null
          python3 -c '
          import json, subprocess
          reqs = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05", "capabilities": {}, "clientInfo": {"name": "ci", "version": "1"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          payload = "\n".join(json.dumps(r) for r in reqs) + "\n"
          for cmd in [["./build/clothbound-mcp"], ["./build/clothbound-mcp", "mcp"], ["./build/clothbound", "mcp"]]:
              p = subprocess.run(cmd, input=payload, capture_output=True, text=True, timeout=15)
              assert p.returncode == 0, f"{cmd} failed: {p.stderr}"
              assert p.stderr == "", f"{cmd} unexpected stderr: {p.stderr}"
              lines = [json.loads(l) for l in p.stdout.splitlines() if l.strip()]
              assert len(lines) == 2 and len(lines[1]["result"]["tools"]) == 6
              print("MCP stdio smoke OK:", cmd, [t["name"] for t in lines[1]["result"]["tools"]])
          '

  arch-asan:
    name: Arch Linux ASan + UBSan
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            cmake \
            ninja \
            ccache \
            qt6-base \
            qt6-declarative \
            qt6-wayland \
            qt6-webengine \
            qt6-webchannel \
            qt6-svg \
            qt6-multimedia \
            libsecret \
            dbus \
            zlib \
            tar \
            bzip2 \
            nodejs \
            xorg-server-xvfb

      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore ccache (asan)
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-arch-asan-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'src/**/*.h', 'src/**/*.cpp', 'tests/**/*.h', 'tests/**/*.cpp') }}
          restore-keys: |
            ccache-arch-asan-${{ runner.arch }}-

      - name: Run full test suite under ASan + UBSan
        run: |
          ccache --zero-stats
          ./bin/test --asan
          ccache --show-stats

  arch-tsan:
    name: Arch Linux TSan Concurrency
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --security-opt seccomp=unconfined
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            cmake \
            ninja \
            ccache \
            qt6-base \
            qt6-declarative \
            qt6-wayland \
            qt6-webengine \
            qt6-webchannel \
            qt6-svg \
            qt6-multimedia \
            libsecret \
            dbus \
            zlib \
            tar \
            bzip2

      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore ccache (tsan)
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-arch-tsan-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'src/**/*.h', 'src/**/*.cpp', 'tests/**/*.h', 'tests/**/*.cpp') }}
          restore-keys: |
            ccache-arch-tsan-${{ runner.arch }}-

      - name: Run concurrency and async palette stress suites under TSan (strict halt_on_error=1)
        run: |
          ccache --zero-stats
          ./bin/test --tsan
          ccache --show-stats

  flatpak:
    name: Flatpak Build & AppStream Lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate AppStream metainfo
        run: appstreamcli validate --pedantic --no-net flatpak/app.clothbound.Reader.metainfo.xml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: clothbound.flatpak
          manifest-path: flatpak/app.clothbound.Reader.yml
          cache: true
          upload-artifact: false

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: clothbound-flatpak-x86_64
          path: clothbound.flatpak

  macos-core-arm64:
    name: macOS Apple Silicon Headless Core & Framework
    runs-on: macos-15
    env:
      QT_VERSION: "6.8.3"
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache-macos
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools via Homebrew
        run: brew install cmake ninja ccache

      - name: Restore official ICU-free Qt 6 cache
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ~/Qt
          key: qt-macos-official-${{ env.QT_VERSION }}-qtbase-qtpdf-v1

      - name: Install official ICU-free Qt 6 (qtbase + qtpdf) via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --upgrade pip aqtinstall
          "$RUNNER_TEMP/aqt-venv/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 -m qtpdf -O "$HOME/Qt"

      - name: Export QT_DIR
        run: |
          QT_DIR="$HOME/Qt/${QT_VERSION}/macos"
          test -d "$QT_DIR/lib/cmake/Qt6"
          echo "QT_DIR=$QT_DIR" >> "$GITHUB_ENV"

      - name: Restore ccache (macos-core-arm64)
        uses: actions/cache@v6
        with:
          path: .ccache-macos
          key: ccache-macos-core-${{ runner.arch }}-${{ env.QT_VERSION }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'src/**/*.h', 'src/**/*.cpp', 'src/**/*.mm', 'tests/**/*.h', 'tests/**/*.cpp') }}
          restore-keys: |
            ccache-macos-core-${{ runner.arch }}-${{ env.QT_VERSION }}-

      - name: Configure & build ClothboundCore.framework, clothbound-mcp, clothbound-tts, and headless tests
        run: |
          ccache --zero-stats
          cmake -S . -B build-macos-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCLOTHBOUND_BUILD_QT_GUI=OFF \
            -DCLOTHBOUND_BUILD_MAC_FRAMEWORK=ON \
            -DCLOTHBOUND_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$QT_DIR/lib/cmake"
          cmake --build build-macos-core --parallel --target \
            ClothboundCore \
            clothbound-mcp \
            clothbound-tts \
            tst_p0_headless_core \
            tst_p0_bridge_tts \
            tst_w8_passage_quant \
            tst_w8_mcp_cli \
            tst_scanner_flatpak
          ccache --show-stats

      - name: Run all 5 headless CTest suites (including tst_p0_bridge_tts)
        run: |
          export CLOTHBOUND_TTS_BIN="$PWD/build-macos-core/clothbound-tts"
          export CLOTHBOUND_MCP_BIN="$PWD/build-macos-core/clothbound-mcp"
          ctest --test-dir build-macos-core --output-on-failure

      - name: Validate WebKit reader JS syntax
        run: node --check src/reader/reader.js src/reader/bridge-webkit.js src/reader/hyphenation.js src/reader/dropcap.js

      - name: Verify ClothboundCore.framework layout, symbols, and strict otool -L hygiene
        run: |
          FW="build-macos-core/ClothboundCore.framework"
          FW_BIN="$FW/Versions/A/ClothboundCore"
          MCP_BIN="build-macos-core/clothbound-mcp"
          TTS_BIN="build-macos-core/clothbound-tts"

          test -f "$FW_BIN"
          test -f "$FW/Versions/A/Headers/clothbound_c.h"
          test -f "$FW/Versions/A/Modules/module.modulemap"
          test -L "$FW/Modules"
          grep -q 'framework module ClothboundCore' "$FW/Versions/A/Modules/module.modulemap"
          otool -D "$FW_BIN" | grep -q '@rpath/ClothboundCore.framework/Versions/A/ClothboundCore'
          nm -gU "$FW_BIN" | grep -q '_cb_engine_create'
          nm -gU "$FW_BIN" | grep -q '_cb_session_open'

          for bin in "$FW_BIN" "$MCP_BIN" "$TTS_BIN"; do
            echo "=== otool -L $bin ==="
            otool -L "$bin"
            bad=$(otool -L "$bin" | grep -iE 'QtWebEngine|QtQuick|QtQml|QtMultimedia|libqcocoa|/opt/homebrew/|icu4c' || true)
            if [ -n "$bad" ]; then
              echo "FORBIDDEN dependency in $bin:" >&2
              echo "$bad" >&2
              exit 1
            fi
          done

          tts_qt=$(otool -L "$TTS_BIN" | grep -iE 'Qt[A-Z]|libQt' || true)
          if [ -n "$tts_qt" ]; then
            echo "FORBIDDEN Qt dependency in clothbound-tts:" >&2
            echo "$tts_qt" >&2
            exit 1
          fi

      - name: Package unsigned ClothboundCore-macos-arm64.tar.gz artifact
        run: |
          STAGE="dist/ClothboundCore-macos-arm64"
          rm -rf "$STAGE" ClothboundCore-macos-arm64.tar.gz
          mkdir -p "$STAGE/Frameworks" "$STAGE/PlugIns" "$STAGE/bin" "$STAGE/reader" "$STAGE/fonts" "$STAGE/i18n"

          cp -a build-macos-core/ClothboundCore.framework "$STAGE/Frameworks/"
          cp -p build-macos-core/clothbound-mcp "$STAGE/bin/"
          cp -p build-macos-core/clothbound-tts "$STAGE/bin/"
          cp -R src/reader/. "$STAGE/reader/"
          cp -p src/fonts/*.ttf "$STAGE/fonts/"
          cp -p src/i18n/*.json "$STAGE/i18n/"

          for qt_fw in QtCore QtGui QtPdf QtNetwork QtSql QtConcurrent; do
            if [ -d "$QT_DIR/lib/${qt_fw}.framework" ]; then
              cp -a "$QT_DIR/lib/${qt_fw}.framework" "$STAGE/Frameworks/"
              rm -rf "$STAGE/Frameworks/${qt_fw}.framework/Headers" \
                     "$STAGE/Frameworks/${qt_fw}.framework/Versions/A/Headers" \
                     "$STAGE/Frameworks/${qt_fw}.framework"/*.prl \
                     "$STAGE/Frameworks/${qt_fw}.framework"/*_debug* \
                     "$STAGE/Frameworks/${qt_fw}.framework/Versions/A"/*_debug*
            fi
          done

          mkdir -p "$STAGE/PlugIns/sqldrivers" "$STAGE/PlugIns/tls" "$STAGE/PlugIns/imageformats"
          if [ -f "$QT_DIR/plugins/sqldrivers/libqsqlite.dylib" ]; then
            cp -p "$QT_DIR/plugins/sqldrivers/libqsqlite.dylib" "$STAGE/PlugIns/sqldrivers/"
          fi
          if [ -d "$QT_DIR/plugins/tls" ]; then
            find "$QT_DIR/plugins/tls" -maxdepth 1 -name '*.dylib' ! -name '*_debug.dylib' \
              -exec cp -p {} "$STAGE/PlugIns/tls/" \;
          fi
          if [ -d "$QT_DIR/plugins/imageformats" ]; then
            for img in libqjpeg.dylib libqgif.dylib libqico.dylib libqwebp.dylib; do
              if [ -f "$QT_DIR/plugins/imageformats/$img" ]; then
                cp -p "$QT_DIR/plugins/imageformats/$img" "$STAGE/PlugIns/imageformats/"
              fi
            done
          fi

          test ! -e "$STAGE/PlugIns/platforms"
          tar -czf ClothboundCore-macos-arm64.tar.gz -C dist ClothboundCore-macos-arm64
          ls -lh ClothboundCore-macos-arm64.tar.gz

      - name: Upload unsigned macOS Core artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClothboundCore-macos-arm64
          path: ClothboundCore-macos-arm64.tar.gz
